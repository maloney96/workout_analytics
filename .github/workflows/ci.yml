name: ci

# Runs on every push. Deliberately needs no secrets, so it works on forks and
# never risks leaking the API key into a PR context.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      # Install the full lockfile rather than an ad-hoc subset: the tests import
      # ingest modules, so anything they import has to be present, and guessing
      # that list breaks the build every time a new import is added.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Compile Python
        run: python -m compileall -q ingest scripts tests

      # Hevy is the system of record; the warehouse is derived. Nothing here may write to it.
      - name: Hevy API is read-only
        run: python -m unittest discover -s tests -v

      # Validates model SQL, Jinja, refs and schema.yml without needing a warehouse.
      - name: dbt project parses
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DUCKDB_PATH: ${{ runner.temp }}/ci.duckdb
        run: dbt parse --project-dir dbt

      - name: Shell syntax
        run: bash -n scripts/sync_secrets.sh

      - name: Config resolves without a key present
        env:
          HEVY_API_KEY: ""
        run: |
          python -c "
          from ingest import config
          assert config.local_tz()
          assert config.duckdb_path()
          print('config OK')
          "

      - name: .env.example covers every synced secret
        run: |
          keys=$(sed -n 's/^SYNCED_KEYS=(\(.*\))/\1/p' scripts/sync_secrets.sh)
          status=0
          for key in $keys; do
            if ! grep -qE "^${key}=" .env.example; then
              echo "::error::$key is synced to GitHub Secrets but missing from .env.example"
              status=1
            fi
          done
          exit $status
